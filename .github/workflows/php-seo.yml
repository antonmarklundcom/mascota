name: PHP SEO site
on:
  pull_request:
    branches: [main]
    paths: ['php-site/**', 'PHP-DEPLOY.md', '.github/workflows/php-seo.yml']
  push:
    branches: [codex/mascota-php-seo]
    paths: ['php-site/**', 'PHP-DEPLOY.md', '.github/workflows/php-seo.yml']
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix php-site/tests --ignore-scripts
      - run: npx --prefix php-site/tests playwright install --with-deps chromium
      - run: python3 php-site/tests/smoke.py --php php
      - run: python3 php-site/tests/test_release.py
      - run: python3 php-site/tests/test_editorial.py --php php
      - run: python3 -m unittest discover -s php-site/tests -p test_keyword_opportunities.py -v
      - run: python3 php-site/tools/package.py --output /tmp/mascota-package
      - name: Verify extracted release
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          package = next(pathlib.Path('/tmp/mascota-package').glob('*.zip'))
          subprocess.run(['python3','php-site/tests/package_smoke.py','--php','php','--zip',str(package)],check=True)
          PY
      - run: node php-site/tests/browser.cjs --php php --output /tmp/mascota-browser
